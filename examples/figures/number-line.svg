<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 96"
     role="img" aria-label="The primes up to 20 marked on a number line">
  <style>
    .axis { stroke: currentColor; stroke-width: 2; fill: none; }
    .tick { stroke: currentColor; stroke-width: 1; opacity: 0.55; }
    .label { fill: currentColor; opacity: 0.65; font: 13px sans-serif;
              text-anchor: middle; }
    .dot { fill: #d7263d; }
  </style>

  <g id="axis" class="axis">
    <line x1="10" y1="62" x2="422" y2="62"/>
  </g>

  <g id="ticks" class="tick">
    <line x1="26" y1="58" x2="26" y2="66"/>
    <line x1="46" y1="58" x2="46" y2="66"/>
    <line x1="66" y1="58" x2="66" y2="66"/>
    <line x1="86" y1="58" x2="86" y2="66"/>
    <line x1="106" y1="58" x2="106" y2="66"/>
    <line x1="126" y1="58" x2="126" y2="66"/>
    <line x1="146" y1="58" x2="146" y2="66"/>
    <line x1="166" y1="58" x2="166" y2="66"/>
    <line x1="186" y1="58" x2="186" y2="66"/>
    <line x1="206" y1="58" x2="206" y2="66"/>
    <line x1="226" y1="58" x2="226" y2="66"/>
    <line x1="246" y1="58" x2="246" y2="66"/>
    <line x1="266" y1="58" x2="266" y2="66"/>
    <line x1="286" y1="58" x2="286" y2="66"/>
    <line x1="306" y1="58" x2="306" y2="66"/>
    <line x1="326" y1="58" x2="326" y2="66"/>
    <line x1="346" y1="58" x2="346" y2="66"/>
    <line x1="366" y1="58" x2="366" y2="66"/>
    <line x1="386" y1="58" x2="386" y2="66"/>
    <line x1="406" y1="58" x2="406" y2="66"/>
  </g>

  <g id="numbers" class="label">
    <text x="26" y="84">1</text>
    <text x="106" y="84">5</text>
    <text x="206" y="84">10</text>
    <text x="306" y="84">15</text>
    <text x="406" y="84">20</text>
  </g>

  <g id="primes" class="dot unrevealed">
    <circle cx="46" cy="62" r="6"/>
    <circle cx="66" cy="62" r="6"/>
    <circle cx="106" cy="62" r="6"/>
    <circle cx="146" cy="62" r="6"/>
    <circle cx="226" cy="62" r="6"/>
    <circle cx="266" cy="62" r="6"/>
    <circle cx="346" cy="62" r="6"/>
    <circle cx="386" cy="62" r="6"/>
  </g>
</svg>
